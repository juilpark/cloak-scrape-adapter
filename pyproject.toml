[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cloak-scrape-adapter"
version = "0.1.0"
description = "Unofficial Firecrawl-compatible scrape adapter powered by CloakBrowser"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Juil Park" }]
dependencies = [
  "cloakbrowser==0.5.3",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.urls]
Repository = "https://github.com/juilpark/cloak-scrape-adapter"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cloak_scrape_adapter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
